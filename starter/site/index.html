<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="虚构东南亚市场进入决策网页练习">
  <title>72 小时出海决策室</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <p class="eyebrow">CLAUDE CODE LEARNING LAB</p>
    <h1>72 小时出海决策室</h1>
    <p class="disclaimer">教学演示 · 数据完全虚构 · 不用于真实经营决策</p>
  </header>

  <main id="main">
    <!-- TODO 1: CEO 摘要：建议、依据、风险、下一步 -->
    <section id="executive-summary" aria-labelledby="summary-title">
      <h2 id="summary-title">当前建议</h2>
      <p>等待 Agent 根据数据和战略情景生成。</p>
    </section>

    <!-- TODO 2: 三国比较与排名 -->
    <section id="market-comparison" aria-labelledby="comparison-title">
      <h2 id="comparison-title">市场比较</h2>
    </section>

    <!-- TODO 3: 情景按钮和五个权重滑块，总和始终为 100% -->
    <section id="scenario-simulator" aria-labelledby="simulator-title">
      <h2 id="simulator-title">战略情景模拟</h2>
    </section>

    <!-- TODO 4: 风险热力图，颜色之外提供文字 -->
    <section id="risk-heatmap" aria-labelledby="risk-title">
      <h2 id="risk-title">风险热力图</h2>
    </section>

    <!-- TODO 5: 30/60/90 天行动计划 -->
    <section id="action-plan" aria-labelledby="action-title">
      <h2 id="action-title">90 天行动</h2>
    </section>

    <!-- TODO 6: 来源、假设、数据缺口，优先使用 details -->
    <section id="evidence" aria-labelledby="evidence-title">
      <h2 id="evidence-title">来源与不确定性</h2>
    </section>
  </main>
</body>
</html>
